name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - compiler: gcc
            build_type: Release
            sanitizers: OFF
            shared: OFF
          - compiler: clang
            build_type: Release
            sanitizers: OFF
            shared: ON
          - compiler: gcc
            build_type: Debug
            sanitizers: ON
            shared: OFF
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/ci
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMEMORY_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DCMAKE_C_FLAGS=-Werror
      - name: Build
        run: cmake --build build/ci --parallel
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
