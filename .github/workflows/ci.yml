name: CI
# Hosted checks are manual while release validation runs locally.
on:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - compiler: gcc
            build_type: Release
            sanitizers: OFF
            shared: OFF
          - compiler: clang
            build_type: Release
            sanitizers: OFF
            shared: ON
          - compiler: gcc
            build_type: Debug
            sanitizers: ON
            shared: OFF
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/ci
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMEMORY_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DCMEMORY_BUILD_BENCHMARKS=ON
          -DCMEMORY_WARNINGS_AS_ERRORS=ON
      - name: Check source formatting
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        run: |
          python3 -m venv build/format-tools
          build/format-tools/bin/python -m pip install clang-format==23.1.3
          git ls-files -z '*.c' '*.h' | xargs -0 build/format-tools/bin/clang-format --dry-run --Werror
      - name: Build
        run: cmake --build build/ci --parallel
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
      - name: Package
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        run: |
          cmake --build build/ci --target package
          cd build/ci
          sha256sum c-memory-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        with:
          name: c-memory-linux-x86_64
          path: |
            build/ci/c-memory-*.tar.gz
            build/ci/SHA256SUMS
